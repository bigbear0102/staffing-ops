name: pull-request-governance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch name
        run: node scripts/validate-branch-name.mjs "${{ github.head_ref }}"
      - name: Validate PR title and body
        run: node scripts/validate-pr-metadata.mjs "${{ github.event.pull_request.title }}" "${{ github.event.pull_request.body }}"
