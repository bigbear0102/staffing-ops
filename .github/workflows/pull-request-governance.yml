name: PR 거버넌스

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 브랜치 이름 검증
        run: node scripts/validate-branch-name.mjs "${{ github.head_ref }}"
      - name: PR 제목 및 본문 검증
        run: node scripts/validate-pr-metadata.mjs "${{ github.event.pull_request.title }}" "${{ github.event.pull_request.body }}"
